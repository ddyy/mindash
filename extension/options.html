<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mindash new tab - settings</title>
<script src="options.js" defer></script>
<style>
  :root { color-scheme: light dark; }
  /* Serves two frames: the toolbar popup and the options dialog opened
     from chrome://extensions. The width suits both - a popup sizes itself
     to its content, and the dialog has room to spare. */
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1rem; width: 22rem; }
  h1 { font-size: 0.95rem; margin: 0 0 0.8rem; }
  label { display: block; margin-bottom: 0.35rem; font-weight: 600; }
  input {
    width: 100%; box-sizing: border-box; padding: 0.45rem 0.6rem; font: inherit;
    border: 1px solid light-dark(#d5d9e0, #333a45); border-radius: 6px;
    background: light-dark(#fff, #1b1e24); color: inherit;
  }
  .hint { color: light-dark(#5b6270, #8b93a1); font-size: 0.82rem; margin: 0.35rem 0 0; }
  .row { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
  button {
    padding: 0.45rem 1rem; font: inherit; cursor: pointer;
    border: 0; border-radius: 6px; background: #3d99f5; color: #fff;
  }
  button.secondary {
    background: none; color: light-dark(#5b6270, #8b93a1);
    border: 1px solid light-dark(#d5d9e0, #333a45);
  }
  button.secondary:hover { color: light-dark(#1d2025, #d6d9de); }
  #msg { font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.5rem; }
  #msg.err { color: #e5534b; }
</style>
</head>
<body>
<h1>mindash new tab</h1>
<form id="f">
  <label for="url">Dashboard URL</label>
  <input id="url" type="url" placeholder="https://dash.example.com/" required>
  <p class="hint">Find it in your dashboard under Settings &rarr; Use as your browser home.</p>
  <div class="row">
    <button type="submit">Save</button>
    <button type="button" id="clear" class="secondary">Clear</button>
  </div>
  <div id="msg"></div>
</form>
</body>
</html>
